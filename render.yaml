services:
  - type: worker
    name: discord-moderation-welcomer
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: guild-config
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
